services:
  api:
    extends:
      file: docker-compose.yml
      service: api
    container_name: vngrocery-api-deploy
    environment:
      VAULT_ENABLED: "true"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
      VAULT_KV_MOUNT: ${VAULT_KV_MOUNT:-secret}
      VAULT_KEYS_PATH_PREFIX: ${VAULT_KEYS_PATH_PREFIX:-account-keys}
      IPFS_ENABLED: "true"
      IPFS_API_URL: http://ipfs:5001
      IPFS_GATEWAY_URL: http://ipfs:8080
      BESU_ENABLED: "true"
      BESU_RPC_URL: http://besu-validator1:8545
      BESU_CHAIN_ID: ${BESU_CHAIN_ID:-1337}
      BESU_CONTRACT_ADDRESS: ${BESU_CONTRACT_ADDRESS}
      BESU_FROM_ADDRESS: ${BESU_FROM_ADDRESS}
      BESU_GAS_LIMIT: ${BESU_GAS_LIMIT:-250000}
      BESU_RECEIPT_TIMEOUT_SEC: ${BESU_RECEIPT_TIMEOUT_SEC:-15}
      BESU_PENDING_INTERVAL_SEC: ${BESU_PENDING_INTERVAL_SEC:-10}
      BESU_VERIFY_INTERVAL_SEC: ${BESU_VERIFY_INTERVAL_SEC:-60}
      BESU_PENDING_BATCH_SIZE: ${BESU_PENDING_BATCH_SIZE:-25}
      BESU_VERIFY_BATCH_SIZE: ${BESU_VERIFY_BATCH_SIZE:-50}
      RATE_LIMIT_BACKEND: firestore
      RATE_LIMIT_COLLECTION: rate_limits
      CACHE_BACKEND: redis
      CACHE_PREFIX: "vngrocery:cache:"
      CACHE_TTL_SECONDS: 10
      REDIS_ADDR: redis:6379
      REDIS_DB: 0
    depends_on:
      vault:
        condition: service_healthy
      ipfs:
        condition: service_started
      redis:
        condition: service_healthy
      besu-validator1:
        condition: service_started
    restart: always
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      vngrocery_app:
      besu_qbft:

  proxy:
    extends:
      file: docker-compose.prod.yml
      service: proxy
    networks:
      - vngrocery_app

  vault:
    extends:
      file: docker-compose.yml
      service: vault
    container_name: vngrocery-vault-deploy
    environment:
      VAULT_API_ADDR: http://127.0.0.1:8200
    command: vault server -config=/vault/config/vault.hcl
    volumes:
      - vault-data:/vault/file
      - ./vault/config:/vault/config:ro
    restart: always
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  ipfs:
    extends:
      file: docker-compose.yml
      service: ipfs
    container_name: vngrocery-ipfs-deploy
    restart: always
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    extends:
      file: docker-compose.yml
      service: redis
    container_name: vngrocery-redis-deploy
    restart: always
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  besu-validator1:
    extends:
      file: docker-compose.besu-qbft.yml
      service: besu-validator1

  besu-validator2:
    extends:
      file: docker-compose.besu-qbft.yml
      service: besu-validator2

  besu-validator3:
    extends:
      file: docker-compose.besu-qbft.yml
      service: besu-validator3

  besu-validator4:
    extends:
      file: docker-compose.besu-qbft.yml
      service: besu-validator4

volumes:
  vault-data:
  ipfs-staging:
  ipfs-data:
  redis-data:

networks:
  vngrocery_app:
    name: vngrocery_app
  besu_qbft:
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: "false"
    ipam:
      driver: default
      config:
        - subnet: 10.42.0.0/16
          gateway: 10.42.0.1
