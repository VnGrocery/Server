# Base stack: api + mongo + vault(dev) + ipfs + redis.
# Blockchain is a separate overlay: docker-compose.besu.yml (1 node, default)
# or docker-compose.besu-qbft.yml (4 validators, demo only).
# Production hardening overlay: docker-compose.prod.yml
#
# Prefer ./scripts/vng over calling docker compose directly.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vngrocery-api
    env_file:
      - .env
    environment:
      PORT: 5000
      # Overrides .env: inside the container 127.0.0.1 is the container itself,
      # so Mongo must be reached by its compose service name.
      MONGODB_ENABLED: "true"
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-vngrocery}
      VAULT_ENABLED: "true"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      VAULT_KV_MOUNT: secret
      VAULT_KEYS_PATH_PREFIX: account-keys
      IPFS_ENABLED: "true"
      IPFS_API_URL: http://ipfs:5001
      IPFS_GATEWAY_URL: http://ipfs:8080
      CACHE_BACKEND: redis
      CACHE_PREFIX: "vngrocery:cache:"
      CACHE_TTL_SECONDS: 10
      REDIS_ADDR: redis:6379
      REDIS_DB: 0
    ports:
      # Host port is configurable: on macOS, ControlCenter (AirPlay Receiver)
      # already listens on 5000. Set API_PORT in .env to move it.
      - "${API_PORT:-5000}:5000"
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      mongo:
        condition: service_healthy
      vault:
        condition: service_healthy
      ipfs:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - vngrocery_app
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: vngrocery-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - vngrocery_app
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.19
    container_name: vngrocery-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    command: vault server -dev -dev-root-token-id=root -dev-listen-address=0.0.0.0:8200
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - vngrocery_app
    restart: unless-stopped

  ipfs:
    image: ipfs/kubo:release
    container_name: vngrocery-ipfs
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ipfs-staging:/export
      - ipfs-data:/data/ipfs
    networks:
      - vngrocery_app
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: vngrocery-redis
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - vngrocery_app
    restart: unless-stopped

volumes:
  mongo-data:
  ipfs-staging:
  ipfs-data:
  redis-data:

networks:
  vngrocery_app:
    name: vngrocery_app
