services:
  vault:
    environment:
      VAULT_API_ADDR: http://127.0.0.1:8200
    command: vault server -config=/vault/config/vault.hcl
    volumes:
      - vault-data:/vault/file
      - ./vault/config:/vault/config:ro
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  vault-data:
