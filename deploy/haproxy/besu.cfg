global
  log stdout format raw local0

defaults
  log global
  mode http
  timeout connect 3s
  timeout client 30s
  timeout server 30s

frontend besu_rpc
  bind *:8545
  default_backend besu_rpc_nodes

backend besu_rpc_nodes
  balance roundrobin
  server rpc1 besu-rpc1:8545 check inter 3s fall 2 rise 2 init-addr last,libc,none
  server rpc2 besu-rpc2:8545 check inter 3s fall 2 rise 2 init-addr last,libc,none
