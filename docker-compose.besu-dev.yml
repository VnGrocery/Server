services:
  besu-dev-init:
    image: alpine:3.20
    command: ["sh", "-c", "chown -R 1000:1000 /data"]
    volumes:
      - besu-dev-data:/data
    restart: "no"

  besu-dev:
    image: ${BESU_IMAGE:-hyperledger/besu:24.3.3}
    container_name: vngrocery-besu-dev
    depends_on:
      besu-dev-init:
        condition: service_completed_successfully
    command:
      - --config-file=/opt/besu/config.toml
      - --identity=vngrocery-dev
      - --p2p-host=0.0.0.0
      - --p2p-port=30303
    volumes:
      - ./besu/dev/config.toml:/opt/besu/config.toml:ro
      - ./besu/dev/genesis.json:/opt/besu/genesis.json:ro
      - ./besu/qbft/keys/validator1/key:/opt/besu/key:ro
      - besu-dev-data:/opt/besu/data
    ports:
      - "8545:8545"
    restart: unless-stopped

volumes:
  besu-dev-data:
