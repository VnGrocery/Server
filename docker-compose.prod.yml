services:
  api:
    environment:
      VAULT_ENABLED: "true"
      IPFS_ENABLED: "true"
      RATE_LIMIT_BACKEND: firestore
      RATE_LIMIT_COLLECTION: rate_limits
      CACHE_BACKEND: redis
      CACHE_PREFIX: "vngrocery:cache:"
      CACHE_TTL_SECONDS: 10
      REDIS_ADDR: redis:6379
      REDIS_DB: 0
    restart: always
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  proxy:
    image: nginx:1.29-alpine
    container_name: vngrocery-proxy-prod
    depends_on:
      api:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  ipfs:
    restart: always
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  vault:
    restart: always
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    restart: always
    logging:
      options:
        max-size: "10m"
        max-file: "5"
